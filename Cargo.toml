[workspace]
members = ["crates/openrpg-core"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/vyroxat/OpenRPG"
rust-version = "1.95"

[workspace.dependencies]
rand = "0.9"
rand_chacha = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
